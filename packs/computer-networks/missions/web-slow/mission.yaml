id: web-slow
title: 慢在哪一环
subtitle: 一次真实抓包的时延归因
estimated_minutes: 15
summary: >-
  课程网站打开得很慢。你拿到的是一份真实的 pcap 抓包（可以直接用 Wireshark 打开核对）。
  你要交付的不是一段结论，而是一张**时延归因表**：把这次加载的墙钟时间拆到各个环节，
  并为每一环钉上作为依据的帧。
why_not_chat: >-
  二进制抓包没法粘进对话框；一旦你把它转述成文字摘要，最难的一步已经被别人替你做完了。
  这里的每一个帧号、每一段时间差，都必须从字节里算出来。

concepts:
  - dns.resolution
  - tcp.handshake
  - http.ttfb
  - tcp.reliability
  - perf.attribution

artifacts:
  - id: capture
    kind: pcap
    path: artifacts/web-slow.pcap
    title: 课程网站访问抓包
    source: synthetic
    license: CC0-1.0

# ---------------------------------------------------------------- 前测
probe:
  - id: p1
    concept: dns.resolution
    difficulty: 1
    prompt: 浏览器访问 http://course.example.edu 时，DNS 解析发生在什么时候？
    expects: choice
    choices:
      - { value: a, label: 在 TCP 三次握手之前 }
      - { value: b, label: 在 TCP 三次握手之后、发出 HTTP 请求之前 }
      - { value: c, label: 与 TCP 握手同时进行 }
    grader:
      kind: choice
      answer: a
      misconceptions: { b: rtx_vs_resolution_confusion, c: rtx_vs_resolution_confusion }
    explain: 必须先拿到 IP 才能向它发 SYN，所以解析一定在握手之前完成。

  - id: p2
    concept: http.ttfb
    difficulty: 2
    prompt: 从 HTTP 请求发出，到第一个响应字节到达，这段时间里包含了什么？
    expects: choice
    choices:
      - { value: a, label: 只有网络往返时间 }
      - { value: b, label: 一个网络往返，加上服务器真正的处理时间 }
      - { value: c, label: 只有服务器处理时间 }
    grader:
      kind: choice
      answer: b
      misconceptions: { a: ttfb_ignores_server_time, c: ttfb_ignores_server_time }
    explain: 首字节时间 = 一个 RTT + 服务器处理，两者都在里面。

  - id: p3
    concept: tcp.reliability
    difficulty: 2
    prompt: 抓包里连续出现三个 ACK 号完全相同的确认帧，最可能说明什么？
    expects: choice
    choices:
      - { value: a, label: 网络把同一个 ACK 复制了三份 }
      - { value: b, label: 接收方收到了失序数据，正在反复索要缺失的那一段 }
      - { value: c, label: 连接即将关闭 }
    grader:
      kind: choice
      answer: b
      misconceptions: { a: retransmission_invisible, c: retransmission_invisible }
    explain: 重复 ACK 是接收方在说"我要的还是这一段"，说明中间有洞。

# ---------------------------------------------------------------- 教学步骤
steps:
  - id: orient
    title: 先看清楚现场
    objective: 在动手拆时间之前，先分清这份抓包里有哪几条独立的会话。
    concepts: [dns.resolution, tcp.handshake]
    scene: packet_lab
    skip_if_mastered: 0.82
    tools:
      - { call: net.pcap.summary,  args: { artifact: capture }, as: summary,  summary: 抓包总览 }
      - { call: net.pcap.flows,    args: { artifact: capture }, as: flows,    summary: 会话切分 }
      - { call: net.pcap.ladder,   args: { artifact: capture }, as: ladder,   summary: 时空梯形图 }
      - { call: net.pcap.frames,   args: { artifact: capture, limit: 60 }, as: frames, summary: 帧列表 }
    knowledge: ["DNS 查询 响应 UDP 53", "TCP 三次握手 SYN"]
    ask: >-
      左边是这次访问的完整时空图。这份抓包里其实有两条独立的会话。
      承载网页正文的是哪一条？
    expects: choice
    choices:
      - { value: a, label: "192.168.1.20:51820 ↔ 192.168.1.1:53（UDP）" }
      - { value: b, label: "192.168.1.20:51782 ↔ 203.0.113.42:80（TCP）" }
      - { value: c, label: "两条都在传网页内容" }
    grader:
      kind: choice
      answer: b
      misconceptions: { a: rtx_vs_resolution_confusion, c: rtx_vs_resolution_confusion }
    hint_ladder:
      - 先不看时间，只看端口号。53 号端口通常承担什么工作？
      - 把两条会话各自传输的字节数比一比，网页正文更可能在哪一条里？
      - 一条会话只是把域名换成了 IP，另一条才真正搬运了内容。
    walkthrough: >-
      抓包里有两条会话：UDP 53 端口那一条是 DNS，它只负责把 course.example.edu 换成
      203.0.113.42；真正搬运网页正文的是 TCP 80 端口那一条。分清这一点很重要——
      接下来拆时间时，这两条会话各自负责总时长里的不同片段。
    leak_guard:
      phrases: ["TCP 80 那条", "选 b", "答案是 b"]
    reveal_after: 2
    max_attempts: 3

  - id: attribute
    title: 把时间拆开
    objective: 把整次加载的墙钟时间不重不漏地分配到五个环节，并为每一环钉上证据帧。
    concepts: [perf.attribution, dns.resolution, http.ttfb, tcp.reliability]
    scene: attribution
    tools:
      - { call: net.pcap.waterfall,  args: { artifact: capture }, as: waterfall, summary: 时延预算基准 }
      - { call: net.pcap.ladder,     args: { artifact: capture }, as: ladder,    summary: 时空梯形图 }
      - { call: net.pcap.anomalies,  args: { artifact: capture }, as: anomalies, summary: 重传与重复确认 }
      - { call: net.pcap.frames,     args: { artifact: capture, limit: 60 }, as: frames, summary: 帧列表 }
    knowledge: ["TCP 重传 超时 快重传", "HTTP 响应 首字节"]
    stage_props:
      buckets:
        - { id: dns,            label: DNS 解析,   hint: 从查询发出到响应到达 }
        - { id: tcp_connect,    label: TCP 建连,   hint: 从 SYN 到握手完成 }
        - { id: ttfb,           label: 请求等待,   hint: 从请求发出到第一个响应字节 }
        - { id: transfer,       label: 数据传输,   hint: 正常搬运数据的时间 }
        - { id: retransmission, label: 重传停顿,   hint: 因为丢包而空转的时间 }
    ask: >-
      现在把这次加载的总时长分配到五个环节里，并且**为每一环至少钉一帧**作为依据。
      不用追求毫秒级精确，但每一桶的量级要对得上，钉的帧要真的承担那个角色。
    expects: attribution
    grader:
      kind: attribution
      truth_from: waterfall
      tolerance_ratio: 0.08
      tolerance_floor_ms: 15
      threshold: 0.8
      require_pins: true
      confusion_threshold_ratio: 0.1
      confusions:
        - { over: ttfb,     under: retransmission, misconception: transfer_time_as_server_think }
        - { over: transfer, under: retransmission, misconception: retransmission_invisible }
        - { over: dns,      under: retransmission, misconception: rtx_vs_resolution_confusion }
        - { over: ttfb,     under: tcp_connect,    misconception: ttfb_ignores_server_time }
      pin_misconceptions:
        dns: pins_do_not_support_claim
        ttfb: pins_do_not_support_claim
        retransmission: pins_do_not_support_claim
    hint_ladder:
      - 先定边界：每一环的**起点帧**和**终点帧**分别是哪两帧？把边界定下来，时间自然就出来了。
      - 时空图上有一段明显的空白，那段时间里服务器方向没有发出任何新数据。先弄清那段空白属于谁。
      - 服务器"想"的时间结束于它吐出第一个字节的那一刻；在那之后还在流逝的时间，要另找解释。
      - 把重复 ACK 出现的位置和那段空白对齐看——接收方在反复索要的，正是空白之后到达的那一段。
    walkthrough: >-
      按帧把边界定下来就清楚了：DNS 是第 1 帧到第 2 帧；TCP 建连是第 3 帧到第 5 帧；
      请求等待是第 6 帧到第 7 帧（服务器真正在处理）；第 7 帧之后数据本来搬得很快；
      真正的大头是第 12–14 帧那段——第 9 帧的序号跳过了一段，接收方连发重复 ACK，
      直到第 14 帧把缺口补上。也就是说，这次"慢"的最大单一原因不是服务器，而是一次丢包引发的停顿。
    leak_guard:
      numbers: [121.4, 188.6, 225.8, 604.6]
      number_tolerance: 0.02
      phrases:
        - 重传是最大的一段
        - 重传停顿最大
        - 最大的一块是重传
        - 丢包才是主因
        - 服务器不是主因
    reveal_after: 3
    max_attempts: 4

  - id: stall
    title: 解释那段空白
    objective: 把"这段时间发生了什么"从现象讲成机制。
    concepts: [tcp.reliability]
    scene: packet_lab
    tools:
      - { call: net.pcap.ladder,    args: { artifact: capture }, as: ladder,    summary: 时空梯形图 }
      - { call: net.pcap.anomalies, args: { artifact: capture }, as: anomalies, summary: 重传与重复确认 }
      - { call: net.pcap.frames,    args: { artifact: capture, limit: 60 }, as: frames, summary: 帧列表 }
      - { call: net.pcap.waterfall, args: { artifact: capture }, as: waterfall, summary: 帧角色标注 }
    knowledge: ["TCP 快重传 重复确认 三个"]
    ask: 第 10 帧到第 14 帧之间，服务器方向长时间没有新数据。这段时间里到底在发生什么？
    expects: choice
    choices:
      - { value: a, label: 服务器还在生成剩下的网页内容 }
      - { value: b, label: 有一段数据在网络中丢失，接收方在反复索要，直到它被重新发出 }
      - { value: c, label: 客户端在做第二次 DNS 查询 }
      - { value: d, label: TCP 连接断开后又重新建立了一次 }
    grader:
      kind: choice
      answer: b
      misconceptions:
        a: transfer_time_as_server_think
        c: rtx_vs_resolution_confusion
        d: retransmission_invisible
    hint_ladder:
      - 看第 11、12、13 帧，它们的 ACK 号一样吗？一样意味着什么？
      - 对比第 8 帧和第 9 帧的序号：中间是不是缺了一段字节？
      - 第 14 帧的序号，正好等于那几个重复 ACK 一直在索要的号。
    walkthrough: >-
      第 8 帧之后本该轮到序号 2897 那一段，但第 9 帧直接跳到了 4345——中间那段在网络里丢了。
      接收方每收到一个失序段就重复一次"我要的还是 2897"，于是出现第 11、12、13 帧三个相同的 ACK。
      发送方直到第 14 帧才把那一段重新发出。这就是那段空白的全部内容：不是服务器慢，是在等一次重传。
    leak_guard:
      phrases: [丢包, 重传, 选 b, 答案是 b]
    reveal_after: 2
    max_attempts: 3

# ---------------------------------------------------------------- 后测
verify:
  - id: v1
    concept: perf.attribution
    difficulty: 2
    prompt: 这次访问里，占用时间最多的单一环节是什么？
    expects: choice
    choices:
      - { value: a, label: DNS 解析 }
      - { value: b, label: 服务器处理请求 }
      - { value: c, label: 一次丢包造成的重传停顿 }
      - { value: d, label: 正常的数据传输 }
    grader:
      kind: choice
      answer: c
      misconceptions: { b: transfer_time_as_server_think, a: rtx_vs_resolution_confusion, d: retransmission_invisible }
    explain: 重传停顿比服务器处理时间还长，这正是只看"感觉"会判断错的地方。

  - id: v2
    concept: tcp.reliability
    difficulty: 2
    prompt: 如果这条链路不丢包，这次访问大约能省下多少时间？
    expects: choice
    choices:
      - { value: a, label: 几乎省不下，瓶颈在服务器 }
      - { value: b, label: 能省下三分之一以上的总时长 }
      - { value: c, label: 只能省下几毫秒 }
    grader:
      kind: choice
      answer: b
      misconceptions: { a: transfer_time_as_server_think, c: retransmission_invisible }
    explain: 重传停顿约占总时长的三分之一强，去掉它的收益比优化服务器更大。
