# 概念图与误区分类法。
#
# 误区（misconception）是本课程包最重要的资产：它们不是"答错了"的同义词，
# 而是**可被程序识别的具体错误模式**——归因时质量分到了哪个桶、仿真里做了
# 哪一类决策。每条都带一句针对性追问，教练用它来问下一个问题，而不是直接
# 讲答案。

concepts:
  - id: dns.resolution
    title: DNS 域名解析
    requires: []
    summary: 把域名变成 IP 需要一次（或多次）查询与响应，这段时间发生在任何 TCP 连接之前。

  - id: tcp.handshake
    title: TCP 三次握手
    requires: []
    summary: SYN / SYN+ACK / ACK 建立连接，代价约一个 RTT，与服务器处理请求的时间无关。

  - id: tcp.reliability
    title: TCP 可靠传输
    requires: [tcp.handshake]
    summary: 序号、累计确认、重复 ACK、快重传与超时重传共同保证字节流不丢不重不乱序。

  - id: tcp.flow_window
    title: 滑动窗口
    requires: [tcp.reliability]
    summary: 窗口限制了未确认数据量；窗口推进由累计确认驱动，而不是由发送方自行决定。

  - id: http.ttfb
    title: HTTP 首字节时间
    requires: [tcp.handshake]
    summary: 从请求发出到第一个响应字节到达，包含一个 RTT 与服务器真正的处理时间。

  - id: perf.attribution
    title: 性能归因
    requires: [dns.resolution, tcp.handshake, http.ttfb, tcp.reliability]
    summary: 把一次加载的墙钟时间不重不漏地拆到各个环节，并为每个环节找到帧级证据。

misconceptions:
  # --- 归因类（任务一） ---
  - id: transfer_time_as_server_think
    title: 把传输/重传时间算成"服务器慢"
    concept: http.ttfb
    note: >-
      你把这段时间归给了服务器。可是服务器"想"的时间，应该结束于它吐出第一个字节的那一刻——
      你能在时间轴上指出第一个响应字节是哪一帧吗？在那之后还在流逝的时间，是谁造成的？

  - id: rtx_vs_resolution_confusion
    title: 把重传停顿算进 DNS 解析
    concept: dns.resolution
    note: >-
      DNS 这一段的起点和终点，分别是哪两帧？在那对帧之外发生的等待，无论多久，
      都不该记在解析头上。你再看看那段长停顿前后，传输方向上发生了什么？

  - id: ttfb_ignores_server_time
    title: 认为首字节时间纯粹是"网络慢"
    concept: http.ttfb
    note: >-
      握手已经量过一次往返了。把那次往返和首字节时间放在一起比一比，
      多出来的部分，网络能解释吗？

  - id: retransmission_invisible
    title: 没有发现重传造成的停顿
    concept: tcp.reliability
    note: >-
      在传输过程中有一段时间，服务器方向没有任何新数据。那段时间里客户端在反复说同一句话——
      它在说什么？它想要哪一段字节？

  - id: pins_do_not_support_claim
    title: 数字对了，但引用的帧站不住
    concept: perf.attribution
    note: >-
      结论和数据对得上，但你钉的帧不承担这个角色。工程结论的分量来自证据本身——
      这一桶的起点帧和终点帧，分别应该是哪两帧？

  # --- 可靠传输类（任务二） ---
  - id: no_fast_retransmit
    title: 收到三个重复 ACK 却不快重传
    concept: tcp.reliability
    note: >-
      接收方已经连着三次告诉你它要的是同一个序号了。它为什么会重复说同一句话？
      与其等定时器慢慢超时，这三次重复本身给了你什么信息？

  - id: gbn_vs_sr_confusion
    title: 一段丢失就重传整个窗口
    concept: tcp.reliability
    note: >-
      重传整窗当然能把洞补上，但代价是什么？接收方的缓存里已经有哪些段了？
      那些它已经收到的，值得再发一次吗？

  - id: cumulative_ack_misread
    title: 重传了已被累计确认的段
    concept: tcp.flow_window
    note: >-
      累计确认 ACK=N 的含义是"N 之前的我都收到了"，而不是"我只收到了 N"。
      按这个含义，你刚才重传的那一段，接收方还需要吗？

  - id: timer_per_packet_not_per_base
    title: 把定时器绑在单个包上而不是窗口基序号
    concept: tcp.flow_window
    note: >-
      超时发生时，最该被怀疑的是哪一段？窗口里最老的那个未确认段和你重传的那个，
      是同一个吗？

  - id: window_never_fills
    title: 窗口里还有空位却在空等
    concept: tcp.flow_window
    note: >-
      看一眼窗口：base 到 next 之间还有多少空位？在等待确认的同时，
      有什么是你现在就可以做的？

  - id: ignores_timeout
    title: 定时器超时后没有任何动作
    concept: tcp.reliability
    note: >-
      定时器已经响过了。超时这个信号本身在告诉你什么？如果谁都不动，这条连接会怎样？

  - id: window_limit_ignored
    title: 无视窗口上限继续发送
    concept: tcp.flow_window
    note: >-
      窗口的作用是限制"已发送但未确认"的数据量。在 base 推进之前，
      你最多还能发出去几段？
