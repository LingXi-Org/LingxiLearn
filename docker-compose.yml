# LingxiLearn — one-command deployment.
#
#   cp .env.example .env    # edit the password, optionally add an LLM key
#   docker compose pull && docker compose up -d
#   open http://localhost:8080
#
# The Compose path is exercised by the Agent-task end-to-end verification.

name: lingxilearn

x-api: &api
  image: accel.way2api.fun/ghcr.io/lingxi-org/lingxilearn-api:latest
  pull_policy: always
  env_file: [.env]
  environment:
    LINGXILEARN_DATABASE_URL: >-
      postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    LINGXILEARN_PACKS_DIR: /app/packs
    LINGXILEARN_VAR_DIR: /app/var
    LINGXILEARN_AGENT_TASK_DIR: /app/var/agent_tasks
    # The API validates the HttpOnly session by calling LingxiIdentity BFF.
    # Keep this internal when both services share the deployment network.
    LINGXILEARN_IDENTITY_BFF_URL: ${LINGXILEARN_IDENTITY_BFF_URL:?set LINGXILEARN_IDENTITY_BFF_URL}
    LINGXILEARN_IDENTITY_BFF_TIMEOUT: ${LINGXILEARN_IDENTITY_BFF_TIMEOUT:-10}
    # Production always validates the shared HttpOnly identity session. Do not
    # inherit the local .env development bypass into this deployment.
    LINGXILEARN_INSECURE_DEV_AUTH: "false"
    LINGXILEARN_AGENT_CONCURRENCY: ${LINGXILEARN_AGENT_CONCURRENCY:-1}
    LINGXILEARN_AGENT_SIDECAR_CONCURRENCY: ${LINGXILEARN_AGENT_SIDECAR_CONCURRENCY:-4}
    LINGXILEARN_DB_POOL_SIZE: ${LINGXILEARN_DB_POOL_SIZE:-3}
    LINGXILEARN_DB_MAX_OVERFLOW: ${LINGXILEARN_DB_MAX_OVERFLOW:-1}
  volumes:
    - ./packs:/app/packs:ro
    - ./skills:/app/skills:ro
    - api-var:/app/var
  depends_on:
    postgres:
      condition: service_healthy
  # Linux Docker does not provide host.docker.internal automatically. The
  # Identity BFF runs in the second Compose project and is published on the
  # host, so let this stack reach it through the host gateway.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: ${DOCKER_REGISTRY:-accel.way2api.fun/docker.io}/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The LingxiLearn web shell proxies browser API requests to the canonical
  # FastAPI service so the browser keeps one same-origin session.
  web:
    image: accel.way2api.fun/ghcr.io/lingxi-org/lingxilearn-web:latest
    pull_policy: always
    env_file: [.env]
    environment:
      LINGXILEARN_API_ORIGIN: http://api:8000
      # Production must use the canonical LingxiIdentity session path.
      DISABLE_AUTH: "false"
      NEXT_PUBLIC_DISABLE_AUTH: "false"
      NEXT_PUBLIC_MOCK_AUTH: "false"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
    depends_on:
      # Next rewrites /auth/* and /api/* to the API. Do not expose the web
      # container until FastAPI's image healthcheck reports that port 8000 is ready.
      api:
        condition: service_healthy
    ports:
      - "${LINGXILEARN_WEB_PORT:-8080}:3000"
    restart: unless-stopped

  # Schema migrations run to completion before the API is allowed to start.
  api-var-init:
    <<: *api
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /app/var/agent_tasks && chown -R 10001:10001 /app/var"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - api-var:/app/var

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      api-var-init:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - ./packs:/app/packs:ro
      - api-var:/app/var

  api:
    <<: *api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api-var-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m

  scheduler:
    <<: *api
    command: ["python", "-m", "lingxilearn.scheduler_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api-var-init:
        condition: service_completed_successfully
    # The scheduler reuses the API image but does not run an HTTP server, so
    # the image's /api/health probe must not mark this worker unhealthy.
    healthcheck:
      disable: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m

volumes:
  postgres-data:
  api-var:
