# LingxiLearn — one-command deployment.
#
#   cp .env.example .env    # edit the password, optionally add an LLM key
#   docker compose up --build
#   open http://localhost:8080
#
# The Compose path is exercised by the Agent-task end-to-end verification.

name: lingxilearn

x-api: &api
  image: ${LINGXILEARN_API_IMAGE:-ghcr.io/lingxi-org/lingxilearn-api:latest}
  pull_policy: always
  env_file: [.env]
  environment:
    LINGXILEARN_DATABASE_URL: >-
      postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    LINGXILEARN_PACKS_DIR: /app/packs
    LINGXILEARN_VAR_DIR: /app/var
    LINGXILEARN_AGENT_TASK_DIR: /app/var/agent_tasks
    # The API validates the HttpOnly session by calling LingxiIdentity BFF.
    # Keep this internal when both services share the deployment network.
    LINGXILEARN_IDENTITY_BFF_URL: ${LINGXILEARN_IDENTITY_BFF_URL:?set LINGXILEARN_IDENTITY_BFF_URL}
    LINGXILEARN_IDENTITY_BFF_TIMEOUT: ${LINGXILEARN_IDENTITY_BFF_TIMEOUT:-10}
    LINGXILEARN_INSECURE_DEV_AUTH: ${LINGXILEARN_INSECURE_DEV_AUTH:-false}
    LINGXILEARN_AGENT_CONCURRENCY: ${LINGXILEARN_AGENT_CONCURRENCY:-1}
    LINGXILEARN_AGENT_SIDECAR_CONCURRENCY: ${LINGXILEARN_AGENT_SIDECAR_CONCURRENCY:-1}
    LINGXILEARN_DB_POOL_SIZE: ${LINGXILEARN_DB_POOL_SIZE:-3}
    LINGXILEARN_DB_MAX_OVERFLOW: ${LINGXILEARN_DB_MAX_OVERFLOW:-1}
  volumes:
    - ./packs:/app/packs:ro
    - ./skills:/app/skills:ro
    - api-var:/app/var
  depends_on:
    postgres:
      condition: service_healthy
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: ${DOCKER_REGISTRY:-docker.m.daocloud.io}/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Native Sim standalone server. API/auth requests are proxied by Next so the
  # browser keeps one same-origin session and never needs a second public port.
  web:
    image: ${LINGXILEARN_WEB_IMAGE:-ghcr.io/lingxi-org/lingxilearn-web:latest}
    pull_policy: always
    environment:
      LINGXILEARN_API_ORIGIN: http://api:8000
      # Local container runs use the UI-only mock session by default. Set to
      # false in a real deployment so auth is handled by LingxiIdentity.
      NEXT_PUBLIC_MOCK_AUTH: ${NEXT_PUBLIC_MOCK_AUTH:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${LINGXILEARN_WEB_PORT:-8080}:3000"
    restart: unless-stopped

  # Schema migrations run to completion before the API is allowed to start.
  api-var-init:
    <<: *api
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /app/var/agent_tasks && chown -R 10001:10001 /app/var"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - api-var:/app/var

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      api-var-init:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - ./packs:/app/packs:ro
      - api-var:/app/var

  api:
    <<: *api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api-var-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m

volumes:
  postgres-data:
  api-var:
