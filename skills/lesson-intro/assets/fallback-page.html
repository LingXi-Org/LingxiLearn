</style></head><body><main><div class="top">课程引入 · 先看见一个问题</div><section class="hero"><div><h1>__TOPIC__，为什么值得先问一个问题？</h1><p class="lead">我们先不急着记定义。把熟悉的现象拆开，看看哪些变化真正决定了结果。</p><p class="question">本节目标：__OBJECTIVE__。接下来要追问的是：我们究竟需要观察哪一个关键关系？</p></div>
