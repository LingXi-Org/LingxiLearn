<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Runtime demo</title><style>
:root{--paper:#fbfaf7;--surface:#fff;--sunken:#f4f2ec;--ink-1:#23231f;--ink-2:#5f5e5a;--ink-3:#8a8880;--rule:rgba(35,35,31,.14);--rule-strong:rgba(35,35,31,.30);--accent:#534ab7;--c1:#7f77dd;--c1-fill:#eeedfe;--c1-ink:#3c3489;--c2:#1d9e75;--c2-fill:#e1f5ee;--c2-ink:#085041;--c3:#d85a30;--c3-fill:#faece7;--c3-ink:#712b13;--font-serif:"Songti SC","SimSun",Georgia,serif;--font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#141412}.slide{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--paper);color:var(--ink-1);font-family:var(--font-sans)}.block{position:absolute;box-sizing:border-box}.t-title{margin:0;font:500 38px/1.24 var(--font-serif)}.t-lead{margin:0;font:400 22px/1.55 var(--font-sans);color:var(--ink-2)}.t{font:400 18px var(--font-sans);fill:var(--ink-1)}.ts{font:400 15px var(--font-sans);fill:var(--ink-2)}.th{font:500 18px var(--font-sans);fill:var(--ink-1)}.tn{font:400 15px var(--font-mono);fill:var(--ink-2)}.arr{stroke:var(--ink-3);stroke-width:1.4;fill:none;stroke-linecap:round}.visual{position:absolute}</style></head><body>
<div class="slide" id="s01" data-slide-id="s01" data-slide-role="content" data-canvas="1280x720" data-style="anthropic-academic">
 <div class="block" style="left:64px;top:64px;width:1152px;height:54px"><h1 class="t-title">放大不是为了看大，而是为了把因果逐层说清</h1></div>
 <div class="block" style="left:64px;top:132px;width:920px;height:48px"><p class="t-lead">输入压力 → 队列持续累积 → 等待时延抬升</p></div>
 <svg class="block visual" data-visual="process" style="left:64px;top:208px;width:1152px;height:344px" viewBox="0 0 1152 344" aria-label="排队因果链">
  <g transform="translate(16 16)"><rect x="0" y="0" width="320" height="272" rx="12" fill="var(--c1-fill)" stroke="var(--c1)" stroke-width=".5"/><text class="th" x="28" y="50">输入压力</text><text class="ts" x="28" y="82">到达速率逼近处理能力</text><path d="M42 220 C110 205 148 184 204 145 C246 116 274 102 292 96" fill="none" stroke="var(--c1)" stroke-width="3"/><text class="tn" x="28" y="244">arrival rate ↑</text></g>
  <path class="arr" d="M350 152 H390"/><path d="M382 145 L390 152 L382 159" fill="none" stroke="var(--ink-3)" stroke-width="1.4"/>
  <g transform="translate(408 16)"><rect x="0" y="0" width="320" height="272" rx="12" fill="var(--c2-fill)" stroke="var(--c2)" stroke-width=".5"/><text class="th" x="28" y="50">队列累积</text><text class="ts" x="28" y="82">系统开始失去“清空窗口”</text><g transform="translate(30 130)"><rect x="0" y="58" width="42" height="40" fill="var(--c2)" opacity=".35"/><rect x="54" y="38" width="42" height="60" fill="var(--c2)" opacity=".5"/><rect x="108" y="12" width="42" height="86" fill="var(--c2)" opacity=".66"/><rect x="162" y="-22" width="42" height="120" fill="var(--c2)" opacity=".82"/><line x1="0" y1="98" x2="240" y2="98" stroke="var(--ink-3)" stroke-width=".5"/></g></g>
  <path class="arr" d="M742 152 H782"/><path d="M774 145 L782 152 L774 159" fill="none" stroke="var(--ink-3)" stroke-width="1.4"/>
  <g transform="translate(800 16)"><rect x="0" y="0" width="320" height="272" rx="12" fill="var(--c3-fill)" stroke="var(--c3)" stroke-width=".5"/><text class="th" x="28" y="50">等待时延</text><text class="ts" x="28" y="82">最后才被用户明显感知</text><path d="M32 220 C120 218 158 207 188 184 C224 156 240 114 286 72" fill="none" stroke="var(--c3)" stroke-width="3"/><circle cx="188" cy="184" r="5" fill="var(--c3)"/><text class="tn" x="28" y="244">latency ↑↑</text></g>
 </svg>
 <div data-anchor="a-demand" data-rect="80 224 320 272" style="position:absolute;left:80px;top:224px;width:320px;height:272px;pointer-events:none"></div>
 <div data-anchor="a-queue" data-rect="472 224 320 272" style="position:absolute;left:472px;top:224px;width:320px;height:272px;pointer-events:none"></div>
 <div data-anchor="a-delay" data-rect="864 224 320 272" style="position:absolute;left:864px;top:224px;width:320px;height:272px;pointer-events:none"></div>

</div></body></html>
