name: Repository artifact hygiene

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: artifact-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tracked-artifacts:
    name: Tracked artifact guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject tracked temporary/build artifacts
        run: bash scripts/check-tracked-artifacts.sh
