name: Architecture boundary checks

on:
  pull_request:
    paths:
      - 'web/app/workspace/**'
      - 'web/lib/**'
      - 'web/hooks/**'
      - 'scripts/check-workspace-boundaries.sh'
      - 'scripts/test-workspace-boundaries.sh'
      - '.github/workflows/arch-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'web/app/workspace/**'
      - 'web/lib/**'
      - 'web/hooks/**'
      - 'scripts/check-workspace-boundaries.sh'
      - 'scripts/test-workspace-boundaries.sh'
      - '.github/workflows/arch-boundary.yml'

concurrency:
  group: arch-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace-boundary:
    name: Workspace module boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Self-test the boundary checker against fixtures
        run: bash scripts/test-workspace-boundaries.sh

      - name: Verify no product page imports from w/**
        run: bash scripts/check-workspace-boundaries.sh web
