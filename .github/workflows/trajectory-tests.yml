name: Trajectory tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: trajectory-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trajectory-utils:
    name: Web trajectory utilities
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Auth boundary check (no Better Auth)
        run: bun run check:auth-boundary

      - name: Run trajectory utility tests
        run: bun run test:trajectory

  trajectory-projector:
    name: Backend trajectory projector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      # The projector itself is backend code; without this job a green
      # "Trajectory tests" only proved the web utilities compile.
      - name: Run trajectory projection and runtime-semantics tests
        run: >-
          uv run --extra dev pytest -q
          tests/test_trajectory_projection.py
          tests/test_sim_runtime_semantics.py
          tests/test_projector.py
