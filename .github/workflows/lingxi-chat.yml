name: Product quality gates

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/lingxilearn/**'
      - 'server/migrations/**'
      - 'server/tests/**'
      - 'contracts/fixtures/**'
      - 'server/pyproject.toml'
      - 'server/uv.lock'
      - '.github/workflows/lingxi-chat.yml'
  workflow_dispatch:

concurrency:
  group: lingxi-chat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend production quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run Lingxi chat tests
        run: bun run test:chat

      - name: Run shared core unit tests
        run: bun run test:unit:core

      - name: Type-check frontend contracts
        run: bun run type-check

      - name: Lint production frontend source
        run: bun run lint:production

      - name: Build production frontend
        run: bun run build

      # Enforce the auth boundary established by issue #52: LingxiLearn must
      # not import Better Auth. All credential, OIDC token and session
      # ownership belongs to the LingxiIdentity BFF.
      - name: Auth boundary check (no Better Auth)
        run: bun run check:auth-boundary

      - name: Check workspace module boundaries
        run: bash ../scripts/check-workspace-boundaries.sh web

      - name: Check production quality boundaries
        run: |
          bun run check:quality-boundaries
          bunx vitest run --config vitest.config.ts scripts/check-quality-boundaries.test.ts

      - name: Check Web source reachability and ownership
        run: bun run audit:lib-reachability

  backend-static:
    name: Backend static quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Ruff production and tests
        run: uv run --extra dev ruff check lingxilearn tests

      - name: Mypy production package
        run: uv run --extra dev mypy lingxilearn

  backend-core:
    name: Backend core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Run backend core suite
        run: uv run --extra dev pytest -q
