name: Lingxi chat checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/lingxilearn/**'
      - 'server/migrations/**'
      - 'server/tests/**'
      - 'contracts/fixtures/**'
      - 'server/pyproject.toml'
      - 'server/uv.lock'
      - '.github/workflows/lingxi-chat.yml'
  workflow_dispatch:

concurrency:
  group: lingxi-chat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lingxi frontend contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run Lingxi chat tests
        run: bun run test:chat

      - name: Type-check frontend contracts
        run: bun run type-check

      # Enforce the auth boundary established by issue #52: LingxiLearn must
      # not import Better Auth. All credential, OIDC token and session
      # ownership belongs to the LingxiIdentity BFF.
      - name: Auth boundary check (no Better Auth)
        run: bun run check:auth-boundary

      - name: Check workspace module boundaries
        run: bash ../scripts/check-workspace-boundaries.sh web

      - name: Check Lingxi frontend changes
        run: >-
          bunx biome check
          app/workspace/[workspaceId]/components/message-actions/message-actions.tsx
          app/workspace/[workspaceId]/home/components/message-content/components/agent-group/agent-group.tsx
          app/workspace/[workspaceId]/home/components/message-content/components/agent-group/tool-call-item.test.tsx
          app/workspace/[workspaceId]/home/components/message-content/components/agent-group/tool-call-item.tsx
          app/workspace/[workspaceId]/home/components/message-content/message-content.tsx
          app/workspace/[workspaceId]/home/components/message-content/components/question/question.tsx
          app/workspace/[workspaceId]/home/components/message-content/components/question/typed-answers.ts
          app/workspace/[workspaceId]/home/components/mothership-chat/mothership-chat.tsx
          app/workspace/[workspaceId]/home/hooks/use-chat.ts
          app/workspace/[workspaceId]/home/hooks/use-lingxi-graph-chat.ts
          app/workspace/[workspaceId]/home/home.tsx
          app/workspace/[workspaceId]/home/types.ts
          lib/lingxi/chat-types.ts
          lib/lingxi/generated/mothership-stream-v1.test.ts
          lib/lingxi/generated/mothership-stream-v1.ts
          lib/lingxi/legacy/v0/lingxi-graph-v0.test.ts
          lib/lingxi/legacy/v0/lingxi-graph-v0.ts
          lib/lingxi/lingxi-task-transport.ts
          lib/lingxi/stream/decode-v1.test.ts
          lib/lingxi/stream/decode-v1.ts
          lib/lingxi/stream/turn-model.test.ts
          lib/lingxi/stream/turn-model.ts
          lib/lingxi/supported-contexts.ts
          lib/lingxi/turn-state.test.ts
          lib/lingxi/turn-state.ts
          stores/mothership-queue/store.test.ts
          stores/mothership-queue/store.ts
          stores/mothership-queue/types.ts
          vitest.config.ts

  backend:
    name: Lingxi backend protocol & lifecycle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Run create-task idempotency regression
        run: uv run --extra dev pytest -q tests/test_agent_tasks.py -k create_agent_task_idempotency

      - name: Run Mothership V1 protocol & lifecycle tests
        run: >-
          uv run --extra dev pytest -q
          tests/test_mothership_stream_v1.py
          tests/test_public_projection.py
          tests/test_interactions.py
          tests/test_interaction_continuation.py
          tests/test_agent_runs_lifecycle.py
          tests/test_parallel_dispatch.py
          tests/test_artifact_resource_versioning.py
          tests/test_sqlite_schema_upgrade.py
          tests/test_thread_and_graph.py
