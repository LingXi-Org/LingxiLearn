name: Container images

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR
        required: false
        default: true
        type: boolean

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./server
            file: ./server/Dockerfile
            scope: lingxilearn-api
          - image: web
            context: ./web
            file: ./web/Dockerfile
            scope: lingxilearn-web

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Guard web production runtime
        if: matrix.image == 'web'
        shell: bash
        run: |
          grep -Eq '^FROM .*\/library\/node:.* AS runtime$' web/Dockerfile
          grep -Fq 'CMD ["node", "server.js"]' web/Dockerfile
          if grep -Fq 'CMD ["bun", "server.js"]' web/Dockerfile; then
            echo 'Bun may build the web app, but production Next standalone must run on Node.' >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^1\.0\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain a 1.0.x semantic version, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lingxilearn-${{ matrix.image }}
          tags: |
            type=sha,format=long

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCKER_REGISTRY=accel.way2api.fun/docker.io
            APT_MIRROR=mirrors.aliyun.com
            PYPI_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
            NPM_REGISTRY=https://registry.npmmirror.com
            NODE_OPTIONS=--max-old-space-size=768
            LINGXILEARN_VERSION=${{ steps.version.outputs.version }}
            LINGXILEARN_REVISION=${{ github.sha }}
            LINGXILEARN_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
