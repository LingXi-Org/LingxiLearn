name: 协作检查

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  approval-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    name: PR 审阅要求
    runs-on: ubuntu-latest
    steps:
      - name: 检查审阅要求
        uses: LingXi-Org/.github/.github/actions/pr-approval-gate@main
        with:
          github_token: ${{ github.token }}
          team_token: ${{ secrets.ORG_GOVERNANCE_TOKEN }}
          org_name: LingXi-Org
          owner_login: leecyang
          mentor_team: mentors
          repository: ${{ github.repository }}
          pr_number: ${{ github.event.pull_request.number }}
          author: ${{ github.event.pull_request.user.login }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          event_action: ${{ github.event.action }}

  issue-approval:
    if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null)
    name: Issue 确认
    runs-on: ubuntu-latest
    steps:
      - name: 检查 Issue 状态
        uses: LingXi-Org/.github/.github/actions/issue-approval@main
        with:
          github_token: ${{ github.token }}
          team_token: ${{ secrets.ORG_GOVERNANCE_TOKEN }}
          org_name: LingXi-Org
          owner_login: leecyang
          mentor_team: mentors
          repository: ${{ github.repository }}
          event_name: ${{ github.event_name }}
          issue_number: ${{ github.event.issue.number }}
          issue_author: ${{ github.event.issue.user.login }}
          issue_body: ${{ github.event.issue.body }}
          actor: ${{ github.actor }}
          comment_body: ${{ github.event.comment.body }}
