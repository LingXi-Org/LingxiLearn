name: LingXi 开发治理

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  approval-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    name: PR 审批门禁
    runs-on: ubuntu-latest
    steps:
      - name: 执行 PR 审批策略
        uses: LingXi-Org/.github/.github/actions/pr-approval-gate@main
        with:
          github_token: ${{ github.token }}
          owner_login: leecyang
          mentor_one: ${{ vars.MENTOR_ONE }}
          mentor_two: ${{ vars.MENTOR_TWO }}
          repository: ${{ github.repository }}
          pr_number: ${{ github.event.pull_request.number }}
          author: ${{ github.event.pull_request.user.login }}
          head_sha: ${{ github.event.pull_request.head.sha }}

  issue-approval:
    if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null)
    name: Issue 审批治理
    runs-on: ubuntu-latest
    steps:
      - name: 执行 Issue 三人审批策略
        uses: LingXi-Org/.github/.github/actions/issue-approval@main
        with:
          github_token: ${{ github.token }}
          owner_login: leecyang
          mentor_one: ${{ vars.MENTOR_ONE }}
          mentor_two: ${{ vars.MENTOR_TWO }}
          repository: ${{ github.repository }}
          event_name: ${{ github.event_name }}
          issue_number: ${{ github.event.issue.number }}
          issue_author: ${{ github.event.issue.user.login }}
          issue_body: ${{ github.event.issue.body }}
          actor: ${{ github.actor }}
          comment_body: ${{ github.event.comment.body }}
