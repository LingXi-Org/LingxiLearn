name: V1 quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: v1-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lingxilearn_test
          POSTGRES_USER: lingxi
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lingxi -d lingxilearn_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LINGXILEARN_DATABASE_URL: postgresql+asyncpg://lingxi:test-only@127.0.0.1:5432/lingxilearn_test
      LINGXILEARN_TEST_DATABASE_URL: postgresql+asyncpg://lingxi:test-only@127.0.0.1:5432/lingxilearn_test
      LINGXILEARN_IDENTITY_BFF_URL: http://identity.invalid
      DS_API_KEY: test-only
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv sync --all-extras --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python scripts/check_architecture.py
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run ruff check lingxilearn scripts tests
      - run: uv run ruff format --check lingxilearn scripts tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run generate:api
      - name: Generated contract is committed
        run: git diff --exit-code -- shared/api/generated/schema.ts
      - run: bun run check
      - run: bun run build
        env:
          LINGXILEARN_API_ORIGIN: http://127.0.0.1:8000
