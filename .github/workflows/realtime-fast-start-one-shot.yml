name: Realtime fast-start one-shot

on:
  push:
    branches: [fix/realtime-stream-fast-start]
    paths:
      - '.github/workflows/realtime-fast-start-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/realtime-stream-fast-start
          fetch-depth: 0

      - name: Apply fast-start fixes
        run: python scripts/apply_realtime_fast_start_fix.py

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: server
        run: uv sync --locked --extra dev

      - name: Run backend regressions
        working-directory: server
        run: >-
          uv run --extra dev pytest -q
          tests/test_realtime_fast_start_regression.py
          tests/test_goal_and_state_update.py
          tests/test_runtime_decisions.py
          tests/test_runtime_loop.py
          tests/test_parallel_dispatch.py
          tests/test_no_fixed_routing.py
          tests/test_mothership_stream_v1.py
          tests/test_public_projection.py
          tests/test_agent_runs_lifecycle.py

      - name: Compile backend
        working-directory: server
        run: uv run python -m compileall -q lingxilearn

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run Lingxi chat tests
        working-directory: web
        run: bun run test:chat

      - name: Type-check frontend
        working-directory: web
        run: bun run type-check

      - name: Check changed frontend files
        working-directory: web
        run: >-
          bunx biome check
          app/workspace/[workspaceId]/home/hooks/use-lingxi-graph-chat.ts
          lib/lingxi/api.ts

      - name: Commit tested source patch
        run: |
          git config user.name "lingxi-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/lingxilearn/runtime/goal_interpreter.py server/lingxilearn/runtime/orchestrator.py server/lingxilearn/api/routes.py server/tests/test_realtime_fast_start_regression.py web/lib/lingxi/api.ts web/app/workspace/[workspaceId]/home/hooks/use-lingxi-graph-chat.ts
          git diff --cached --check
          git commit -m "fix: stream replies live and shorten fast-start path"
          git push origin HEAD:fix/realtime-stream-fast-start
