name: Durable assistant one-shot repair

on:
  push:
    branches: [fix/durable-assistant-live-graph]
    paths:
      - '.github/workflows/durable-assistant-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/durable-assistant-live-graph
          fetch-depth: 0

      - name: Apply repair
        run: python scripts/apply_durable_assistant_fix.py

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: server
        run: uv sync --locked --extra dev

      - name: Run backend regressions
        working-directory: server
        run: >-
          uv run --extra dev pytest -q
          tests/test_durable_turn_regression.py
          tests/test_parallel_dispatch.py
          tests/test_mothership_stream_v1.py
          tests/test_agent_runs_lifecycle.py
          tests/test_interaction_continuation.py
          tests/test_agent_tasks.py

      - name: Compile backend
        working-directory: server
        run: uv run python -m compileall -q lingxilearn

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run frontend regressions
        working-directory: web
        run: >-
          bunx vitest run
          lib/lingxi/stream/turn-model.test.ts
          lib/lingxi/live-stream-regression.test.ts
          lib/lingxi/generated/mothership-stream-v1.test.ts

      - name: Type-check frontend
        working-directory: web
        run: bun run type-check

      - name: Check frontend formatting
        working-directory: web
        run: >-
          bunx biome check
          'lib/lingxi/chat-types.ts'
          'lib/lingxi/stream/turn-model.ts'
          'lib/lingxi/stream/turn-model.test.ts'
          'lib/lingxi/live-stream-regression.test.ts'
          'app/workspace/[workspaceId]/home/hooks/use-lingxi-graph-chat.ts'

      - name: Commit tested repair
        run: |
          git config user.name "lingxi-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/lingxilearn/runtime/contracts.py server/lingxilearn/runtime/completion.py server/lingxilearn/runtime/orchestrator.py server/lingxilearn/runtime/dispatch.py server/lingxilearn/agents/providers/teaching.py server/tests/test_durable_turn_regression.py web/lib/lingxi/chat-types.ts web/lib/lingxi/stream/turn-model.ts web/lib/lingxi/stream/turn-model.test.ts web/lib/lingxi/live-stream-regression.test.ts 'web/app/workspace/[workspaceId]/home/hooks/use-lingxi-graph-chat.ts'
          git diff --cached --check
          git commit -m "fix: keep assistant output durable and graph live"
          git push origin HEAD:fix/durable-assistant-live-graph
