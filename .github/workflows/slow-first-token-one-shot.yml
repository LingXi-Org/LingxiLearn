name: Slow first-token one-shot fix

on:
  push:
    branches: [fix/slow-first-token-runtime]
    paths:
      - '.github/workflows/slow-first-token-one-shot.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/slow-first-token-runtime
          fetch-depth: 0

      - name: Apply runtime latency fixes
        run: python scripts/apply_slow_first_token_fix.py

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: server
        run: uv sync --locked --extra dev

      - name: Run targeted regressions
        working-directory: server
        run: uv run --extra dev pytest -q tests/test_slow_first_token_regression.py tests/test_parallel_dispatch.py tests/test_public_projection.py tests/test_mothership_stream_v1.py tests/test_agent_runs_lifecycle.py

      - name: Compile backend
        working-directory: server
        run: uv run python -m compileall -q lingxilearn

      - name: Commit tested patch
        run: |
          git config user.name "lingxi-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/lingxilearn/service.py server/lingxilearn/runtime/loop.py server/tests/test_slow_first_token_regression.py
          git diff --cached --check
          git commit -m "fix: stream learner output without orchestration stalls"
          git push origin HEAD:fix/slow-first-token-runtime
