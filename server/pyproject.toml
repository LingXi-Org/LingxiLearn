[project]
name = "lingxilearn"
version = "0.1.0"
description = "AI learning and engineering-practice assistant for undergraduate engineering students."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "lingxigraph[openai,coze,postgres]>=2.0.1,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.38,<3",
    "alembic>=1.13,<2",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<1",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
lingxilearn = "lingxilearn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lingxilearn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:lingxilearn.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
